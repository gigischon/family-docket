<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Docket</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Docket">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F5FBF">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<link rel="manifest" href="manifest.json?v=1">
<style>body{margin:0}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
#fdGate{position:fixed;inset:0;z-index:1000;background:var(--bg,#F3F5F7);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(28px,env(safe-area-inset-top,0px)) 16px 28px}
#fdGate[hidden]{display:none}
#fdGate form{width:100%;max-width:400px;background:var(--panel,#fff);border:1px solid var(--line,#DDE2E8);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;margin-top:4vh;box-shadow:0 8px 30px rgba(20,30,50,.08)}
#fdGate .gl{display:flex;align-items:center;gap:12px}
#fdGate .gm{width:48px;height:48px;border-radius:12px;background:var(--accent,#1F5FBF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;letter-spacing:.5px}
#fdGate h2{margin:0;font-size:22px;color:var(--ink,#18212F)}
#fdGate .gs{margin:0;color:var(--muted,#5E6A7B);font-size:14.5px;line-height:1.45}
#fdGate label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px;color:var(--ink,#18212F)}
#fdGate input{box-sizing:border-box;width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line,#DDE2E8);background:var(--panel,#fff);color:var(--ink,#18212F);min-height:46px}
#fdGate button{font:inherit;font-size:16px;min-height:48px;border-radius:10px;cursor:pointer;font-weight:700}
#fdGate .go{background:var(--accent,#1F5FBF);color:#fff;border:0}
#fdGate .go:disabled{opacity:.6}
#fdGate .alt{background:transparent;border:1px solid var(--line,#DDE2E8);color:var(--ink,#18212F);font-weight:600}
#fdGate .gmsg{margin:0;font-size:14.5px;line-height:1.45;color:var(--ink,#18212F);min-height:1em}
#fdGate .gmsg.err{color:#B42318}
#fdGate [hidden]{display:none!important}
#fdHome{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:900;background:var(--ink,#18212F);color:var(--bg,#fff);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.4;display:flex;gap:10px;align-items:center}
#fdHome[hidden]{display:none}
#fdHome button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
</style>
<div id="fdGate" hidden>
  <form id="fdForm" novalidate>
    <div class="gl"><div class="gm" aria-hidden="true">FD</div><h2 id="fdTitle">Family Docket</h2></div>
    <p class="gs" id="fdSub"></p>
    <label id="fdNameW" hidden>Your name<input id="fdName" type="text" maxlength="60" autocomplete="name" placeholder="First and last name"></label>
    <label id="fdEmailL">Email<input id="fdEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label id="fdPassL">Password<input id="fdPass" type="password" autocomplete="current-password"></label>
    <label id="fdPass2W" hidden>Confirm password<input id="fdPass2" type="password" autocomplete="new-password"></label>
    <label id="fdCodeW" hidden>Code from your email<input id="fdCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits"></label>
    <p class="gmsg" id="fdMsg" role="status" aria-live="polite"></p>
    <button type="submit" class="go" id="fdGo">Sign in</button>
    <button type="button" class="alt" id="fdResend" hidden>Send a new code</button>
    <button type="button" class="alt" id="fdSwap">Create an account</button>
  </form>
</div>
<div id="fdHome" hidden><span style="flex:1">You're in. To open it like an app: tap <b>Share</b>, then <b>Add to Home Screen</b>.</span><button type="button" id="fdHomeX">OK</button></div>
<script>
/* Family Docket, Google version: connects the app to the family list kept in Google, and handles signing in.
   It gives the app the same small set of tools the Claude version has (saved items, photos, saving a file). */
(function () {
  "use strict";
  var REMOTE = "https://script.google.com/macros/s/AKfycbxgMcpcNNZ6Lg9RGopK_7vn7_Gu6uU64f29OJiraBbO8ZWn3zlL4X6wHXMbs36ReGWAEg/exec", URLKEY = "__DEVICE_KEY__", JOIN = "__JOIN_KEY__", APP_URL = "__APP_URL__";
  function real(v) { return /^__[A-Z_]+__$/.test(v) ? "" : v; }
  REMOTE = real(REMOTE); URLKEY = real(URLKEY).replace(/[^a-f0-9]/g, ""); JOIN = real(JOIN); APP_URL = real(APP_URL);
  var params = new URLSearchParams(location.search);
  if (!JOIN) JOIN = (params.get("join") || "").replace(/[^a-z0-9]/g, "");
  var KEEP = "fd-key", JK = "fd-join";
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k) || ""; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ""; } }
  if (JOIN) ls(JK, JOIN); else JOIN = ls(JK);
  var TOKEN = URLKEY || ls(KEEP);
  window.FD_GOOGLE = true;
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- talking to Google ---------- */
  function send(req) {
    return new Promise(function (res, rej) {
      var done = function (r) { r && r.ok ? res(r) : rej(r || { error: "failed" }); };
      if (REMOTE) {
        fetch(REMOTE, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(req), redirect: "follow" })
          .then(function (r) { return r.json(); }).then(done, function () { rej({ error: "network" }); });
      } else if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(done).withFailureHandler(function () { rej({ error: "network" }); }).api(req);
      } else rej({ error: "network" });
    });
  }
  function call(action, extra) { return send(Object.assign({ action: action, token: TOKEN }, extra || {})); }

  /* ---------- the family list, kept here and refreshed from Google ---------- */
  var cache = {}, listeners = [], loaded = false, pending = 0, ready, readyRes;
  ready = new Promise(function (r) { readyRes = r; });
  function snap(col) {
    var docs = Object.keys(cache).filter(function (id) { return cache[id].col === col; })
      .map(function (id) { var d = cache[id].data; return { id: id, data: function () { return d; } }; });
    return { docs: docs, metadata: { fromCache: false } };
  }
  function fire() { listeners.forEach(function (l) { try { l.cb(snap(l.col)); } catch (e) {} }); }
  function take(r) {
    var c = {}; (r.items || []).forEach(function (x) { if (x && x.data && x.data.id) c[x.data.id] = { col: x.col, data: x.data }; });
    cache = c; window.FD_LINKS = r.links || null; window.FD_ME = (r.me && r.me.email) || ""; window.FD_ROLE = (r.me && r.me.role) || "";
  }
  function load(quiet) {
    return call("load").then(function (r) {
      if (pending) return;        // a save is on its way; the next refresh picks it up
      take(r); loaded = true; fire(); readyRes(true);
    }, function (e) { if (e && e.error === "signin") signedOut("Please sign in again."); else if (!quiet) readyRes(true); });
  }
  setInterval(function () { if (loaded && document.visibilityState === "visible") load(true); }, 45000);
  document.addEventListener("visibilitychange", function () { if (loaded && document.visibilityState === "visible") load(true); });
  var chain = Promise.resolve();
  function write(req, apply) {
    apply(); fire(); pending++;
    var p = chain.then(function () { return call(req.action, req); });
    chain = p.then(function () {}, function () {});
    return p.then(function () { pending--; }, function (e) {
      pending--;
      if (e && e.error === "signin") { signedOut("Please sign in again."); }
      var err = new Error("save failed"); err.code = e && e.error === "denied" ? "invalid_argument" : "unavailable"; throw err;
    });
  }
  var db = {
    collection: function (col) {
      return {
        doc: function (id) {
          return {
            set: function (d) { return write({ action: "saveItem", col: col, id: id, data: d }, function () { cache[id] = { col: col, data: Object.assign({}, d, { id: id }) }; }); },
            delete: function () { return write({ action: "deleteItem", col: col, id: id }, function () { if (cache[id] && cache[id].col === col) delete cache[id]; }); },
            get: function () { var x = cache[id]; return Promise.resolve({ exists: !!(x && x.col === col), data: function () { return x ? x.data : null; } }); }
          };
        },
        onSnapshot: function (cb) { var l = { col: col, cb: cb }; listeners.push(l); if (loaded) setTimeout(function () { cb(snap(col)); }, 0); return function () { listeners = listeners.filter(function (x) { return x !== l; }); }; }
      };
    },
    doc: function () { return { get: function () { return Promise.resolve({ exists: false, data: function () { return null; } }); }, set: function () { return Promise.resolve(); } }; }
  };

  /* ---------- photos: kept in Google, shown from here ---------- */
  var photos = {}, asking = {};
  var MARK = "data:,fdp-";
  window.__fdBlobUrl = function (id) { if (photos[id]) return photos[id]; getPhoto(id); return MARK + id; };
  function getPhoto(id) {
    if (asking[id] || photos[id] || !/^[a-f0-9]{32}$/.test(id)) return;
    asking[id] = 1;
    call("getPhoto", { id: id }).then(function (r) { photos[id] = r.data; fix(); }, function () { setTimeout(function () { delete asking[id]; }, 15000); });
  }
  function fix() {
    document.querySelectorAll('img[src^="' + MARK + '"], a[href^="' + MARK + '"]').forEach(function (n) {
      var attr = n.tagName === "A" ? "href" : "src", id = n.getAttribute(attr).slice(MARK.length);
      if (photos[id]) n.setAttribute(attr, photos[id]); else getPhoto(id);
    });
  }
  var fixQueued = false;
  new MutationObserver(function () { if (fixQueued) return; fixQueued = true; requestAnimationFrame(function () { fixQueued = false; fix(); }); })
    .observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ["src", "href"] });
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight, 1)), c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error("not a picture")); };
      img.src = url;
    });
  }
  var assets = {
    upload: function (file) {
      return shrink(file).then(function (data) {
        return call("savePhoto", { data: data }).then(function (r) { photos[r.id] = data; return { id: r.id, url: data, sizeBytes: data.length, contentType: "image/jpeg" }; });
      });
    },
    list: function () { return Promise.resolve({ assets: [], usage: {} }); },
    delete: function () { return Promise.resolve(); }
  };
  var downloads = {
    save: function (o) {
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data], { type: /\.ics$/i.test(o.filename) ? "text/calendar" : "application/octet-stream" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename || "file";
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
      return Promise.resolve();
    }
  };
  var user = { canEdit: function () { return Promise.resolve(true); }, isOwner: function () { return Promise.resolve(window.FD_ROLE === "owner"); }, can: function () { return Promise.resolve(true); } };
  window.claude = {
    use: function (name) {
      if (name === "db") return ready.then(function () { return loaded ? db : null; });
      if (name === "assets") return ready.then(function () { return loaded ? assets : null; });
      if (name === "downloads") return Promise.resolve(downloads);
      if (name === "user") return Promise.resolve(user);
      return Promise.resolve(null);   // the Claude-only extras (smart reading, Gmail) are not in this version
    }
  };


  /* ---------- reading a card photo: Google's free text reader (no AI) ---------- */
  function blobToData(b) { return shrink(b); }
  window.__fdReadCard = function (blobs) {
    return Promise.all(blobs.slice(0, 2).map(blobToData)).then(function (imgs) {
      return call("readCard", { images: imgs });
    }).then(function (r) {
      var c = r.card || {};
      if (!c.issuer && !c.memberId && !c.group) { var e = new Error("unread"); e.code = "unread"; throw e; }
      return c;
    });
  };

  /* ---------- Ask Claude: requests answered by Elliot's Claude on his computer ---------- */
  var KINDS = [
    ["import", "Add from a photo or text", "A school sheet, flyer, receipt or message. Claude adds everything to the right sections."],
    ["ask", "Ask about our schedule", "For example: what's coming up this week? When is the next day off?"],
    ["order", "Find my order", "Say what you bought, even roughly (\"the wallet\"). Claude looks through the order emails."],
    ["email", "Search my email", "For example: Camp Achim registration, or a teacher's name."]
  ];
  var askKind = "import", askPhotos = [], askList = null;
  function escH(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(ms) { if (!ms) return ""; var d = new Date(ms); return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
  function listHTML() {
    if (!askList) return '<div class="empty">Loading…</div>';
    if (!askList.length) return '<div class="empty">Nothing sent yet.</div>';
    return askList.map(function (q) {
      var k = KINDS.filter(function (x) { return x[0] === q.kind; })[0];
      var st = q.status === "done" ? '<span class="chip" style="background:#E3F4EA;color:#1D6B3F">Answered</span>'
        : q.status === "failed" ? '<span class="chip" style="background:#FBE7E6;color:#A12C22">Couldn\'t do it</span>'
        : '<span class="chip" style="background:#FFF4D6;color:#7A5A00">Waiting for Claude</span>';
      return '<div class="fdq"><div class="fdq-h"><b>' + escH(k ? k[1] : q.kind) + '</b>' + st + '<span class="fdq-t">' + escH(when(q.createdAt)) + '</span></div>' +
        (q.text ? '<div class="fdq-x">' + escH(q.text) + '</div>' : '') + (q.photos && q.photos.length ? '<div class="fdq-x" style="color:var(--muted)">' + q.photos.length + ' photo' + (q.photos.length > 1 ? 's' : '') + '</div>' : '') +
        (q.answer ? '<div class="fdq-a">' + escH(q.answer).replace(/\n/g, "<br>") + '</div>' : '') + '</div>';
    }).join("");
  }
  function refreshList() {
    call("requests").then(function (r) { askList = r.requests || []; var b = document.getElementById("fdAskList"); if (b) b.innerHTML = listHTML(); }, function () {});
  }
  setInterval(function () { if (document.getElementById("fdAskList") && document.visibilityState === "visible") refreshList(); }, 30000);
  window.__fdAskView = function () {
    setTimeout(refreshList, 0);
    return '<div class="view-head"><div><h2>Ask Claude</h2><p>Send a photo, a question or a search. Elliot\'s Claude handles it and the answer shows here, usually within 15 minutes while his computer is on. New items appear in the app by themselves.</p></div></div>' +
      '<style>.fdk{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.fdk button{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}.fdk button span{font-size:13px;color:var(--muted)}.fdk button.on{border-color:var(--accent);background:var(--soft)}.fdq{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}.fdq-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fdq-t{color:var(--muted);font-size:12.5px;margin-left:auto}.fdq-a{background:var(--soft);border-radius:8px;padding:10px;line-height:1.5}.fdq-x{font-size:14px}#fdAskList{display:flex;flex-direction:column;gap:10px}.fdthumbs{display:flex;gap:8px;flex-wrap:wrap}.fdthumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}</style>' +
      '<section class="panel"><div class="panel-b" style="display:flex;flex-direction:column;gap:14px;padding:16px">' +
      '<div class="fdk">' + KINDS.map(function (k) { return '<button type="button" data-fdkind="' + k[0] + '" class="' + (askKind === k[0] ? "on" : "") + '"><b>' + escH(k[1]) + '</b><span>' + escH(k[2]) + '</span></button>'; }).join("") + '</div>' +
      '<div class="field"><label for="fdAskText">What do you need?</label><textarea id="fdAskText" rows="3" placeholder="Type here, or just add photos"></textarea></div>' +
      '<div class="fdthumbs" id="fdAskThumbs"></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><label class="btn">Add photos<input type="file" id="fdAskPhotos" accept="image/*" multiple hidden></label>' +
      '<button type="button" class="btn primary" id="fdAskSend">Send to Claude</button><span id="fdAskMsg" style="font-size:14px"></span></div>' +
      '</div></section>' +
      '<section style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px">Sent to Claude</h3><div id="fdAskList">' + listHTML() + '</div></section>';
  };
  function thumbs() { var t = document.getElementById("fdAskThumbs"); if (t) t.innerHTML = askPhotos.map(function (p) { return '<img alt="" src="' + p.url + '">'; }).join(""); }
  document.addEventListener("click", function (e) {
    var k = e.target.closest && e.target.closest("[data-fdkind]");
    if (k) { askKind = k.getAttribute("data-fdkind"); document.querySelectorAll("[data-fdkind]").forEach(function (b) { b.classList.toggle("on", b === k); }); return; }
    if (e.target.closest && e.target.closest("#fdAskSend")) {
      var btn = document.getElementById("fdAskSend"), msgEl = document.getElementById("fdAskMsg"), text = (document.getElementById("fdAskText").value || "").trim();
      if (!text && !askPhotos.length) { msgEl.textContent = "Type something or add a photo first."; return; }
      btn.disabled = true; msgEl.textContent = askPhotos.length ? "Saving photos…" : "Sending…";
      Promise.all(askPhotos.map(function (p) { return p.id ? Promise.resolve(p.id) : assets.upload(p.file).then(function (r) { p.id = r.id; return r.id; }); }))
        .then(function (ids) { msgEl.textContent = "Sending…"; return call("ask", { kind: askKind, text: text, photos: ids }); })
        .then(function () {
          btn.disabled = false; askPhotos = []; thumbs(); document.getElementById("fdAskText").value = "";
          msgEl.textContent = "Sent. Claude will answer here, usually within 15 minutes."; refreshList();
        }, function () { btn.disabled = false; msgEl.textContent = "Couldn't send. Check your connection and try again."; });
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target && e.target.id === "fdAskPhotos") {
      [].slice.call(e.target.files || []).slice(0, 6 - askPhotos.length).forEach(function (f) { askPhotos.push({ file: f, url: URL.createObjectURL(f) }); });
      e.target.value = ""; thumbs();
    }
  });

  /* ---------- signing in ---------- */
  var mode = "in", needCode = false;
  function msg(t, err) { $("fdMsg").textContent = t || ""; $("fdMsg").className = "gmsg" + (err ? " err" : ""); }
  function setMode(m) {
    mode = m; needCode = false;
    $("fdNameW").hidden = m !== "new"; $("fdPass2W").hidden = m !== "new"; $("fdPass2").value = "";
    $("fdEmailL").firstChild.nodeValue = m === "new" ? "Email account" : "Email";
    $("fdPassL").firstChild.nodeValue = m === "new" ? "Make a password" : "Password";
$("fdCodeW").hidden = true; $("fdResend").hidden = true; $("fdCode").value = "";
    $("fdPass").setAttribute("autocomplete", m === "new" ? "new-password" : "current-password");
    $("fdGo").textContent = m === "new" ? "Create account" : "Sign in";
    $("fdSwap").textContent = m === "new" ? "I already have an account" : "Create an account";
    $("fdSub").textContent = m === "new" ? "Make your account: your name, your email, and a password you'll remember (at least 6 characters), typed twice." : "Sign in with your email and password.";
    msg("");
  }
  function showGate(m, t) { $("fdGate").hidden = false; setMode(m); if (t) msg(t); }
  function signedOut(t) { TOKEN = ""; ls(KEEP, null); loaded = false; showGate("in", t); }
  window.__fdSignOut = function () { call("logout").catch(function () {}); signedOut("You're signed out."); };
  $("fdSwap").addEventListener("click", function () {
    if (mode === "in" && !JOIN) { msg("To make an account, open the invite link you were sent, then come back here.", true); return; }
    setMode(mode === "new" ? "in" : "new");
  });
  $("fdResend").addEventListener("click", function () { needCode = false; $("fdCode").value = ""; submit(); });
  $("fdForm").addEventListener("submit", function (e) { e.preventDefault(); submit(); });
  function submit() {
    var email = $("fdEmail").value.trim(), pass = $("fdPass").value, name = $("fdName").value.trim(), code = $("fdCode").value.replace(/\D/g, "");
    if (mode === "new" && !name) return msg("Type your name.", true);
    if (!email || !pass) return msg("Type your email and password.", true);
    if (mode === "new" && pass.length < 6) return msg("Use at least 6 characters for the password.", true);
    if (mode === "new" && pass !== $("fdPass2").value) return msg("The two passwords don't match. Type them again.", true);
    if (needCode && code.length !== 6) return msg("Type the 6-digit code from your email.", true);
    $("fdGo").disabled = true; msg(needCode ? "Checking the code…" : mode === "new" ? "Making your account…" : "Signing in…");
    send({ action: mode === "new" ? "signup" : "login", email: email, pass: pass, name: name, join: JOIN, code: needCode ? code : "" }).then(function (r) {
      $("fdGo").disabled = false;
      TOKEN = r.token; ls(KEEP, TOKEN);
      $("fdPass").value = ""; $("fdPass2").value = ""; $("fdGate").hidden = true;

<script>
(() => {
"use strict";
// ---------- constants ----------
const CATS = {
  school:{label:"School", color:"--c-school", desc:"School calendar, days off, early dismissals"},
  event:{label:"Events", color:"--c-event", desc:"PTA, parties, games, sign-up slots"},
  return:{label:"Returns", color:"--c-return", desc:"Store returns with deadlines"},
  pay:{label:"Payments", color:"--c-pay", desc:"Bills, Zelle, Venmo, tuition and anything you pay on a schedule"},
  paper:{label:"Papers", color:"--c-paper", desc:"Forms, slips and documents due"},
  appt:{label:"Appointments", color:"--c-appt", desc:"Doctor, dentist, services"},
  task:{label:"To-dos", color:"--c-task", desc:"Everything else"}
};
const STORES = {
  "Amazon":{days:30, drop:"Whole Foods, Kohl's, UPS Store"},
  "Walmart":{days:90, drop:"Any Walmart store or mail"},
  "Target":{days:90, drop:"Target store (Drive Up returns)"},
  "Costco":{days:90, drop:"Any Costco (most items: no limit)"},
  "Best Buy":{days:15, drop:"Best Buy store"},
  "Home Depot":{days:90, drop:"Home Depot store"},
  "Lowe's":{days:90, drop:"Lowe's store"},
  "Kohl's":{days:180, drop:"Kohl's store"},
  "Macy's":{days:30, drop:"Macy's store or mail"},
  "Old Navy":{days:30, drop:"Old Navy / Gap store"},
  "Other":{days:30, drop:""}
};
const RET_STEPS = ["To return","Packed","Dropped off","Refunded"];
const PAPER_STEPS = ["To do","Done"];
const PAY_STEPS = ["Unpaid","Paid"];
const PAY_METHODS = ["Zelle","Venmo","PayPal","Check","Autopay","Credit card","Bank transfer","Online portal","Cash"];
const REPEATS = {"":"Doesn't repeat", weekly:"Every week", biweekly:"Every 2 weeks", monthly:"Every month", quarterly:"Every 3 months", yearly:"Every year"};
const REPEAT_CATS = ["pay","paper","task"];
const VIEWS = ["today","calendar","school","event","return","pay","paper","appt","task","import","wallet","photos"];
const GMAIL = "Gmail";
const SCHOOL_KINDS = {
  off:{label:"No school", color:"--crit"},
  early:{label:"Early dismissal", color:"--warn"},
  event:{label:"School event", color:"--c-school"},
  info:{label:"Good to know", color:"--c-task"}
};
function schoolKind(it){
  if(it.kind && SCHOOL_KINDS[it.kind]) return it.kind;
  const s=((it.title||"")+" "+(it.notes||"")).toLowerCase();
  if(/clos|recess|no school|holiday|break|day off|vacation|no classes/.test(s)) return "off";
  if(/early dismissal|half[ -]day|early release|single session/.test(s)) return "early";
  if(/concert|show|game|night|fair|picture|assembly|trip|party|performance|play|parade|conference/.test(s)) return "event";
  return "info";
}
const photoIds = it => (it.photos||[]).filter(x=>typeof x==="string");
const blobUrl = id => window.FD_GOOGLE && window.__fdBlobUrl ? window.__fdBlobUrl(id) : "/_blob/" + encodeURIComponent(id);
const ICON = {
  clock:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  person:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  doc:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v3a5 5 0 0 0 10 0v-2"/><circle cx="20" cy="12" r="2"/></svg>',
  phone:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>'
};
function nextDate(ds, rep){
  const d=parseD(ds); if(!d) return "";
  if(rep==="weekly") return iso(addDays(d,7));
  if(rep==="biweekly") return iso(addDays(d,14));
  const months = rep==="monthly"?1:rep==="quarterly"?3:rep==="yearly"?12:0; if(!months) return "";
  const day=d.getDate(); const x=new Date(d.getFullYear(), d.getMonth()+months, 1);
  const last=new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); x.setDate(Math.min(day,last)); return iso(x);
}
const money = n => { const v=Number(String(n||"").replace(/[^0-9.\-]/g,"")); return isFinite(v)?v:0; };
const fmtMoney = n => "$"+money(n).toLocaleString(undefined,{minimumFractionDigits:money(n)%1?2:0, maximumFractionDigits:2});

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b) => Math.round((a-b)/86400000);
const fmtDate = (s, opts={weekday:"short", month:"short", day:"numeric"}) => { const d=parseD(s); return d ? d.toLocaleDateString(undefined, opts) : ""; };
const fmtTime = t => { if(!t) return ""; const [h,m]=t.split(":").map(Number); if(isNaN(h)) return t; const ap=h>=12?"pm":"am"; const hh=((h+11)%12)+1; return m? `${hh}:${pad(m)}${ap}` : `${hh}${ap}`; };
const uid = () => "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const cc = cat => `var(${(CATS[cat]||CATS.task).color})`;
const keyDate = it => it.cat==="return" ? (it.returnBy || it.date) : it.date;

function dueChip(dateStr, doneish){
  const d = parseD(dateStr); if(!d) return "";
  const n = diffDays(d, today());
  if(doneish) return `<span class="due ok">${esc(fmtDate(dateStr,{month:"short",day:"numeric"}))}</span>`;
  if(n < 0) return `<span class="due crit">${-n}d overdue</span>`;
  if(n === 0) return `<span class="due crit">today</span>`;
  if(n <= 3) return `<span class="due crit">${n}d left</span>`;
  if(n <= 7) return `<span class="due warn">${n}d left</span>`;
  return `<span class="due ok">${n}d left</span>`;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }
function isDone(it){ return it.cat==="return" ? it.status==="Refunded" : it.cat==="pay" ? it.status==="Paid" : (it.cat==="paper"||it.cat==="task") ? it.status==="Done" : false; }
const isOpenList = cat => cat==="pay"||cat==="paper"||cat==="task"||cat==="return";
// When a repeating item is completed, create the next one.
function spawnNext(it){
  if(!it.repeat || !REPEAT_CATS.includes(it.cat)) return null;
  const nd = nextDate(it.date, it.repeat); if(!nd) return null;
  const {id,paidOn,confNo,createdAt,updatedAt,example,...rest} = it;
  const nx = {...rest, id:uid(), date:nd, createdAt:new Date().toISOString(), bring:(it.bring||[]).map(b=>({t:b.t,done:false}))};
  if(it.cat==="pay") nx.status="Unpaid"; else if(it.cat==="paper"||it.cat==="task") nx.status="To do";
  return nx;
}

// ---------- data layer ----------
const state = { items:new Map(), mode:"loading", db:null, sample:null, downloads:null, view:"today", q:"", storeFilter:"All", calMonth:null, preview:[], images:[], readOnly:false };
const LS_KEY = "familyDocket.items.v1";

function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) JSON.parse(raw).forEach(it=>state.items.set(it.id,it)); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...state.items.values()])); }catch(e){} }

// Private things (Wallet cards and Payments) live in their own "private" collection,
// which only people given full access (Can edit) can read. Everything else is in "items".
const PRIVATE_CATS = new Set(["card","pay"]);
const colFor = it => PRIVATE_CATS.has(it.cat) ? "private" : "items";
const itemLoc = new Map(); // id -> collection it is stored in
async function writeItem(it){
  const col=colFor(it), was=itemLoc.get(it.id);
  await state.db.collection(col).doc(it.id).set(JSON.parse(JSON.stringify(it)));
  itemLoc.set(it.id,col);
  if(was && was!==col){ try{ await state.db.collection(was).doc(it.id).delete(); }catch(e){} }
}
async function saveItem(it){
  it.updatedAt = new Date().toISOString();
  state.items.set(it.id, it); render();
  if(state.mode==="db"){
    try{ await writeItem(it); }
    catch(e){ handleWriteErr(e); }
  } else saveLocal();
}
async function saveMany(list){
  for(const it of list){ it.updatedAt=new Date().toISOString(); state.items.set(it.id,it); }
  render();
  if(state.mode==="db"){
    for(const it of list){ try{ await writeItem(it); }catch(e){ handleWriteErr(e); break; } }
  } else saveLocal();
}
async function removeItem(id){
  const it=state.items.get(id);
  state.items.delete(id); render();
  if(state.mode==="db"){ try{ await state.db.collection(itemLoc.get(id)||(it?colFor(it):"items")).doc(id).delete(); itemLoc.delete(id); }catch(e){ handleWriteErr(e); } }
  else saveLocal();
}
function handleWriteErr(e){
  if(e && e.code==="invalid_argument"){ state.readOnly=true; toast("You can view this docket but not change it."); }
  else if(e && e.code==="quota_exceeded"){ toast("Storage is full. Delete some old items, then try again."); }
  else toast("Couldn't save just now. Check your connection and try again.");
  render();
}

async function initData(){
  const c = window.claude;
  let db = null;
  if(c && c.use){
    try{ db = await c.use("db"); }catch(e){ db=null; }
    c.use("sample").then(s=>{ state.sample=s; render(); }).catch(()=>{});
    c.use("downloads").then(d=>{ state.downloads=d; render(); }).catch(()=>{});
    c.use("assets").then(a=>{ state.assets=a; render(); }).catch(()=>{});
    c.use("mcp").then(m=>{ state.mcp=m; render(); }).catch(()=>{});
  }
  if(db){
    state.db=db; state.mode="db";
    let first=true;
    const timer=setTimeout(()=>{ if(first){ $("#syncNote").textContent="Can't reach your saved items yet. Showing what's here."; } },10000);
    db.doc("meta/mail").get().then(s=>{ if(s.exists){ state.mailMeta=s.data(); render(); } }).catch(()=>{});
    const parts={items:new Map(), private:new Map()};
    const merge=()=>{ const m=new Map(); for(const col of ["items","private"]) parts[col].forEach((v,k)=>m.set(k,v)); state.items=m; };
    const listen=(col,onErr)=>db.collection(col).onSnapshot(snap=>{
      const m=new Map(); snap.docs.forEach(d=>{ const v=d.data(); if(v){ m.set(d.id,{...v,id:d.id}); itemLoc.set(d.id,col); } });
      parts[col]=m; merge();
      if(col==="items" && !snap.metadata.fromCache){ first=false; clearTimeout(timer); }
      render();
    }, onErr);
    listen("items", err=>{ clearTimeout(timer); first=false; state.mode="local"; loadLocal(); render(); });
    listen("private", ()=>{}); // people without full access simply see none of these
    c.use("user").then(u=>u&&u.canEdit?u.canEdit():null).then(ok=>{ if(ok===false){ state.readOnly=true; state.viewOnly=true; render(); } }).catch(()=>{});
  } else {
    state.mode="local"; loadLocal(); render();
  }
}

// ---------- queries ----------
function allItems(){ return [...state.items.values()]; }
function matches(it,q){
  if(!q) return true;
  const hay = [it.title,it.notes,it.location,it.person,it.provider,it.phone,it.store,it.orderNo,it.status,it.method,it.payTo,it.amount,it.confNo,REPEATS[it.repeat||""],CATS[it.cat]?.label,(it.bring||[]).map(b=>b.t).join(" "),it.date,fmtDate(it.date,{month:"long",day:"numeric"}),fmtDate(it.date,{month:"short",day:"numeric"}),it.returnBy].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}
function sortByDate(a,b){ return (keyDate(a)||"9999").localeCompare(keyDate(b)||"9999") || (a.start||"").localeCompare(b.start||""); }
function occursOn(it, ds){
  if(it.cat==="return") return (it.returnBy||it.date)===ds && !isDone(it);
  if(!it.date) return false;
  if(it.endDate && it.endDate>it.date) return ds>=it.date && ds<=it.endDate;
  return it.date===ds;
}

// ---------- render: rows ----------
function rowHTML(it, showDate){
  const timeTxt = it.allDay||!it.start ? (it.endDate&&it.endDate!==it.date ? "multi-day" : "all day") : fmtTime(it.start)+(it.end?"–"+fmtTime(it.end):"");
  const left = showDate ? esc(fmtDate(keyDate(it),{month:"short",day:"numeric"})) : esc(timeTxt);
  const subBits=[];
  if(showDate && it.start) subBits.push(timeTxt);
  if(it.person) subBits.push(it.person);
  if(it.provider) subBits.push(it.provider);
  if(it.location) subBits.push(it.location);
  if(it.cat==="return"){ subBits.push([it.store,it.amount?"$"+it.amount:"",it.status].filter(Boolean).join(" · ")); }
  if(it.cat==="pay"){ subBits.push([it.amount?fmtMoney(it.amount):"", it.method, it.payTo?("to "+it.payTo):"", it.status==="Paid"&&it.paidOn?("paid "+fmtDate(it.paidOn,{month:"short",day:"numeric"})):""].filter(Boolean).join(" · ")); }
  if(it.repeat) subBits.push("↻ "+REPEATS[it.repeat]);
  if(it.slot) subBits.push("Your slot: "+it.slot);
  const bring = (it.bring||[]).length ? `<div class="bring">${it.bring.map(b=>`<span class="${b.done?"done":""}">${esc(b.t)}</span>`).join("")}</div>` : "";
  let right = `<span class="chip" style="--cc:${cc(it.cat)}">${esc(CATS[it.cat]?.label||"Item")}</span>`;
  if(isOpenList(it.cat)) right = dueChip(keyDate(it), isDone(it)) || right;
  return `<div class="row" data-id="${esc(it.id)}" tabindex="0" role="button">
    <span class="bar" style="background:${cc(it.cat)}"></span>
    <span class="t">${left}</span>
    <div style="min-width:0"><div class="ti">${esc(it.title)}${it.example?' <span class="chip" style="--cc:var(--muted)">example</span>':""}</div>${subBits.length?`<div class="sub">${esc(subBits.join(" · "))}</div>`:""}${bring}</div>
    <div>${right}</div></div>`;
}
function agendaHTML(list, emptyMsg){
  if(!list.length) return `<div class="empty">${emptyMsg}</div>`;
  const groups = new Map();
  const t = iso(today());
  for(const it of list){
    const k = it.date && it.endDate && it.date < t && it.endDate >= t ? t : keyDate(it) || "Undated";
    if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(it);
  }
  return [...groups.entries()].map(([d,arr])=>{
    const dd=parseD(d); const n=dd?diffDays(dd,today()):null;
    const rel = n===0?"Today":n===1?"Tomorrow":"";
    return `<div class="day-h ${n===0?"today":""}"><span>${esc(dd?fmtDate(d,{weekday:"long",month:"short",day:"numeric"}):d)}</span>${rel?`<span>· ${rel}</span>`:""}</div>${arr.map(i=>rowHTML(i,false)).join("")}`;
  }).join("");
}

// ---------- organized cards (School, Events, Appointments) ----------
function relDays(ds){ const d=parseD(ds); if(!d) return ""; const n=diffDays(d,today()); return n===0?"Today":n===1?"Tomorrow":n<0?`${-n} days ago`:`In ${n} days`; }
function dateTile(it){
  const d=parseD(keyDate(it));
  if(!d) return `<div class="dtile" style="--cc:${cc(it.cat)}"><span class="m">No</span><span class="d">–</span><span class="w">date</span></div>`;
  return `<div class="dtile" style="--cc:${cc(it.cat)}"><span class="m">${esc(d.toLocaleDateString(undefined,{month:"short"}))}</span><span class="d">${d.getDate()}</span><span class="w">${esc(d.toLocaleDateString(undefined,{weekday:"short"}))}</span></div>`;
}
function whenText(it){
  const multi = it.endDate && it.date && it.endDate>it.date;
  const bits=[];
  if(multi){ const n=diffDays(parseD(it.endDate),parseD(it.date))+1; bits.push(`Through ${fmtDate(it.endDate,{weekday:"short",month:"short",day:"numeric"})} (${n} days)`); }
  if(it.start) bits.push(fmtTime(it.start)+(it.end?" – "+fmtTime(it.end):""));
  else if(!multi) bits.push("All day");
  return bits.join(" · ");
}
const STORE_URLS = {"Amazon":"https://www.amazon.com/gp/css/order-history","Walmart":"https://www.walmart.com/orders","Target":"https://www.target.com/orders"};
const CAM = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

function cardActions(it){
  const done=isDone(it), a=[];
  if(it.cat==="return"){
    const idx=Math.max(0,RET_STEPS.indexOf(it.status||"To return"));
    if(it.code) a.push(`<button class="btn sm primary" data-photo="${esc(it.code)}">Show code</button>`);
    if(it.labelPdf && /^[0-9a-f]{32}$/.test(it.labelPdf)) a.push(`<a class="btn sm primary" href="${blobUrl(it.labelPdf)}" target="_blank" rel="noopener">Open return label</a>`);
    if(idx<3 && !state.readOnly) a.push(`<button class="btn sm" data-advance="${esc(it.id)}">Mark ${esc(RET_STEPS[idx+1].toLowerCase())}</button>`);
    if(STORE_URLS[it.store] && idx===0) a.push(`<a class="btn sm" href="${STORE_URLS[it.store]}" target="_blank" rel="noopener">Get return label on ${esc(it.store)}</a>`);
    if(!STORE_URLS[it.store] && it.emailFrom && idx===0 && state.mcp && !state.readOnly) a.push(`<button class="btn sm" data-draftret="${esc(it.id)}">Draft return email</button>`);
    if(it.draftUrl && /^https:\/\/mail\.google\.com\//.test(it.draftUrl)) a.push(`<a class="btn sm" href="${esc(it.draftUrl)}" target="_blank" rel="noopener">Open draft in Gmail</a>`);
    if(it.emailUrl && /^https:\/\/mail\.google\.com\//.test(it.emailUrl)) a.push(`<a class="btn sm" href="${esc(it.emailUrl)}" target="_blank" rel="noopener">Open email</a>`);

  if((it.cat==="paper"||it.cat==="task") && !done && !state.readOnly) a.push(`<button class="btn sm primary" data-done="${esc(it.id)}">Mark done</button>`);
  const pb=photoBtn(it); if(pb) a.push(pb);
  return a.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${a.join("")}</div>`:"";
}
function ecard(it){
  const cat=it.cat, kind = cat==="school" ? SCHOOL_KINDS[schoolKind(it)] : null;
  const bring=it.bring||[]; const left=bring.filter(b=>!b.done).length;
  const ph=photoIds(it); const done=isDone(it);
  let right, meta;
  if(cat==="return"){
    const idx=Math.max(0,RET_STEPS.indexOf(it.status||"To return"));
    right=dueChip(it.returnBy, done);
    meta=[it.store&&`<span class="chip" style="--cc:var(--c-return)">${esc(it.store)}</span>`, it.amount&&`<span><b style="color:var(--ink)">${esc(fmtMoney(it.amount))}</b>&nbsp;refund</span>`, it.orderNo&&`<span class="mono">#${esc(it.orderNo)}</span>`, it.method&&`<span>${ICON.pin}${esc(it.method)}</span>`,

function copyText(v){ const s=String(v||""); if(!s) return Promise.resolve(false);

    if(b.hasAttribute("data-signout")){ lb.close(); window.__fdSignOut(); return; }
    if(b.hasAttribute("data-cplink")) copyText(shareLink("regular")).then(ok=>toast(ok?"Link copied":APP_LINK));
    if(b.dataset.cpmsg) copyText(inviteText(b.dataset.cpmsg)).then(ok=>toast(ok?"Message copied. Paste it in a text or WhatsApp.":"Couldn't copy. Use Copy link instead."));

    }

      b.disabled=true; b.textContent="Saving…";

      }catch(err){ b.disabled=false; b.textContent="Couldn't save. Use Copy message instead."; }
    } };
  if(!lb.open) lb.showModal();
}

async function readCardPhotos(blobs){
  if(window.__fdReadCard) return window.__fdReadCard(blobs);   // Google version: Google's free text reader, no AI
  const x = await state.sample.json(`These are photos of the front${blobs.length>1?" and back":""} of a card from someone's wallet (insurance, pharmacy, ID or membership card).
Read it and reply with only a JSON object:
{"kind": one of "health","dental","vision","pharmacy","membership","id","other",
 "issuer": the company or organization name as printed, "plan": plan or product name or "", "memberName": the member's name or "", "memberId": member or ID number exactly as printed or "",
 "group": group number or "", "fields": up to 6 other useful items as [{"label": short label, "value": value}] such as Rx BIN, Rx PCN, Rx Group, copays, member services phone, expiration date,
 "color": the card's main color, one of ${Object.keys(CARD_COLORS).map(k=>`"${k}"`).join(", ")}}
If this is a credit or debit card, reply {"kind":"payment"} and nothing else.`, {images:blobs, modelTier:"default"});
  return x && typeof x==="object" && !Array.isArray(x) ? x : {};

const SORT_RULES = `Sorting rules: put each item in the section where it belongs. Money owed (fees, tuition, bills, deposits) is "pay". A form, registration, application, permission slip or document to fill out, sign or send is "paper". A date when something happens that you attend is "event" (or "school" for school-wide calendar dates). A doctor, dentist or similar visit is "appt". When one notice involves several of these (for example a camp: the session dates, the registration form and the fee), make a separate item for each in its own section.`;
const QUICK_FORMS = [["pay","Zelle or payment"],["return","Return"],["event","Event or PTA"],["school","School date"],["paper","Form or paper"],["appt","Appointment"],["task","To-do"],["card","Insurance, ID or credit card"]];
function itemSchemaText(){
  return `Each item is a JSON object:
{"cat": one of "school" (school calendar dates), "event" (PTA, parties, games, sign-ups), "return" (store return), "pay" (money owed: Zelle, Venmo, bills, tuition, fees), "paper" (forms, permission slips, documents due), "appt" (doctor, dentist, appointments), "task" (other to-dos),
 "title": short clear title (for payments: what it's for), "date": "YYYY-MM-DD" or "" (for payments the due date; for returns the purchase/delivery date), "endDate": "YYYY-MM-DD" or "",
 "start": "HH:MM" 24-hour or "", "end": "HH:MM" or "", "location": "", "slot": "" (volunteer time slot), "bring": [short strings of things to bring or do], "notes": "" or one short sentence,
 "person": who it is for (a child or family member named in the text) or "", "provider": for appointments the doctor, dentist or provider's name and practice, as written, or "", "phone": the office phone number if given or "",
 "store": for returns e.g. "Amazon","Walmart","Target","Costco" else "", "orderNo": "", "amount": number as string or "", "returnBy": "YYYY-MM-DD" for returns (stated deadline, else typical policy: Amazon 30 days, Walmart/Target/Costco/Home Depot 90, Best Buy 15) else "",
 "method": for payments one of ${PAY_METHODS.map(m=>`"${m}"`).join(", ")} or "", "payTo": for payments who to pay or "", "repeat": "" or "weekly","biweekly","monthly","quarterly","yearly"}
For appointments, make the title the person and the kind of visit, like "Yaakov – dentist", and put the doctor or dentist in "provider".
${SORT_RULES}`;
}
function normItem(x, person, hint){
  const D=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||"")?s:"", T=s=>/^\d{1,2}:\d{2}$/.test(s||"")?s.padStart(5,"0"):"";
  const cat = CATS[x.cat]?x.cat:(hint||"task");
  const it = {cat, title:String(x.title||"").slice(0,160), date:D(x.date), endDate:D(x.endDate), start:T(x.start), end:T(x.end),

function mailBar(where){
  if(!state.mcp || !state.sample) return "";
  const last = state.mailMeta?.lastChecked ? new Date(state.mailMeta.lastChecked).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "";
  const what = where==="return" ? "Finds return emails from Amazon, Walmart, Costco and other stores, with the item, refund amount and return-by date."
    : "Finds return, school and payment emails from the last 30 days and lays them out for you to add.";
  return `<div class="mailbar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    <span class="sub" id="mailStatus">${state.mailBusy?`<span class="spin"></span> ${esc(state.mailMsg||"Checking…")}`:esc(what)+(last?` Last checked ${esc(last)}.`:"")}</span>
    <button class="btn" data-act="check-mail" ${state.mailBusy||state.readOnly?"disabled":""}>Check my Gmail</button></div>`;
}
function setMail(msg){ state.mailMsg=msg; const s=$("#mailStatus"); if(s) s.innerHTML=`<span class="spin"></span> ${esc(msg)}`; }
async function checkEmail(){
  if(state.mailBusy) return;
  state.mailBusy=true; setMail("Searching your Gmail…"); render();
  try{
    const q='newer_than:30d (subject:(return OR refund OR "drop off" OR "return label" OR "return started") OR subject:(school OR PTA OR "permission slip" OR "field trip" OR dismissal OR conference OR "school calendar") OR subject:(zelle OR venmo OR invoice OR "payment due" OR tuition OR "amount due" OR "bill is ready"))';
    const r = await state.mcp.callTool(GMAIL, "search_threads", {query:q, pageSize:25, view:"THREAD_VIEW_SUMMARY"});
    const threads = (r && r.payload && Array.isArray(r.payload.threads)) ? r.payload.threads : [];
    const seen = new Set(state.mailMeta?.seen || []);
    const fresh = threads.filter(t=>t && t.id && !seen.has(t.id)).slice(0,12);
    if(!fresh.length){ await saveMailMeta([]); state.mailBusy=false; render(); toast("No new emails to add."); return; }
    setMail(`Reading ${fresh.length} email${fresh.length===1?"":"s"}…`);
    const mails=[];
    for(const t of fresh){
      try{
        const g = await state.mcp.callTool(GMAIL, "get_thread", {threadId:t.id, messageFormat:"PLAIN_TEXT"});
        const msgs = (g && g.payload && Array.isArray(g.payload.messages)) ? g.payload.messages : [];
        const m = msgs[msgs.length-1] || (t.messages||[])[0] || {};
        mails.push({ref:mails.length, url:String(t.viewUrl||m.viewUrl||""), msgId:String(m.id||""), subject:String(m.subject||""), from:String(m.sender||""), date:String(m.date||"").slice(0,10), text:String(m.plaintextBody||m.snippet||"").replace(/\s+\n/g,"\n").slice(0,3500)});
      }catch(e){}
    }
    setMail("Claude is sorting them…");
    const arr = await state.sample.json(`Today is ${iso(today())}. Below are recent emails from a parent's inbox, as JSON. Pick out only real things to do, pay, return or attend: store returns, school dates, PTA events, permission slips, bills and money owed.
Ignore marketing, newsletters, shipping or delivery notices with nothing to do, and receipts for things already paid.
For store returns give the item name as the title, the refund amount, order number, return-by date and the drop-off method or place.
Reply with only a JSON array. ${itemSchemaText()}
Also add "ref": the ref number of the email each item came from.

EMAILS:
${JSON.stringify(mails.map(({url,msgId,...m})=>m))}`, {modelTier:"default"});
    const items = (Array.isArray(arr)?arr:[]).filter(x=>x&&x.title).map(x=>{ const it=normItem(x,"",""); it.id=uid(); it.source="email"; const m=mails[Number(x.ref)];
      if(m){ if(m.url) it.emailUrl=m.url; if(isEmail(m.from)) it.emailFrom=m.from; if(m.msgId) it.emailMsgId=m.msgId; } it._on=true; return it; });
    await saveMailMeta(fresh.map(t=>t.id));
    state.mailBusy=false;
    if(!items.length){ render(); toast("Checked your email. Nothing new to add."); return; }
    state.preview=items; state.previewFrom="email"; go("import"); toast(`Found ${items.length} item${items.length===1?"":"s"} in your email`);
  }catch(e){
    state.mailBusy=false; render();
    const code=e&&e.code;
    toast(code==="not_granted"||code==="server_not_connected" ? "Gmail isn't connected for this page. Allow it when asked, or connect Gmail in Claude's settings." : code==="rate_limited" ? "Too many requests. Try again in a minute." : "Couldn't check email just now. Try again.");
  }
}
async function saveMailMeta(newIds){
  const seen=[...newIds, ...(state.mailMeta?.seen||[])].slice(0,500);
  state.mailMeta={seen, lastChecked:new Date().toISOString()};
  if(state.mode==="db"){ try{ await state.db.doc("meta/mail").set(state.mailMeta); }catch(e){} }
}

// ---------- ICS export ----------
const slug = s => (s||"item").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"item";
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
async function exportICS(list, filename){
  if(!state.downloads){ toast("Calendar export isn't available in this view."); return; }
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Family Docket//EN","CALSCALE:GREGORIAN"];
  for(const it of list){
    const ds = it.cat==="return" ? it.returnBy : it.date; if(!ds) continue;
    const d=ds.replace(/-/g,"");
    lines.push("BEGIN:VEVENT","UID:"+it.id+"@family-docket","DTSTAMP:"+stamp);
    if(it.start){
      const s=it.start.replace(":","")+"00"; const e=(it.end||it.start).replace(":","")+"00";
      lines.push("DTSTART:"+d+"T"+s, "DTEND:"+d+"T"+(it.end?e:String(Number(it.start.slice(0,2))+1).padStart(2,"0")+it.start.slice(3)+"00"));
    } else {
      const end = iso(addDays(parseD(it.endDate&&it.endDate>ds?it.endDate:ds),1)).replace(/-/g,"");
      lines.push("DTSTART;VALUE=DATE:"+d, "DTEND;VALUE=DATE:"+end);
    }
    const title = it.cat==="return" ? `Return deadline: ${it.title} (${it.store||""})` : it.cat==="pay" ? `Pay: ${it.title}${it.amount?" "+fmtMoney(it.amount):""}${it.method?" via "+it.method:""}` : it.title;
    const desc=[it.person&&("For: "+it.person), it.payTo&&("Pay to: "+it.payTo), it.repeat&&REPEATS[it.repeat], it.slot&&("Your slot: "+it.slot), (it.bring||[]).length&&("Bring: "+it.bring.map(b=>b.t).join(", ")), it.orderNo&&("Order #"+it.orderNo), it.notes].filter(Boolean).join("\n");
    lines.push("SUMMARY:"+icsEsc(title));
    if(it.location) lines.push("LOCATION:"+icsEsc(it.location));
    if(desc) lines.push("DESCRIPTION:"+icsEsc(desc));
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  try{ await state.downloads.save({filename, data:lines.join("\r\n")}); toast("Calendar file saved. Open it to add to Outlook or Google Calendar."); }
  catch(e){ if(e && e.code!=="declined" && e.code!=="cancelled") toast("Couldn't save the calendar file."); }
}

          bring:Array.isArray(x.bring)?x.bring.filter(Boolean).map(b=>({t:String(b).slice(0,80),done:false})):[],
          person, source:"import", _on:true};
        if(cat==="return"){ it.store=STORES[x.store]?x.store:(x.store?"Other":"Amazon"); it.orderNo=String(x.orderNo||""); it.amount=String(x.amount||""); it.returnBy=/^\d{4}-\d{2}-\d{2}$/.test(x.returnBy||"")?x.returnBy:""; it.status="To return"; }
        if(cat==="paper"||cat==="task") it.status="To do";
        if(cat==="pay"){ it.status="Unpaid"; it.amount=String(x.amount||""); it.method=PAY_METHODS.includes(x.method)?x.method:""; it.payTo=String(x.payTo||""); }
        if(REPEAT_CATS.includes(cat) && REPEATS[x.repeat]!==undefined) it.repeat=x.repeat||"";
        return it;
      });
      $("#impStatus").textContent="";
    }
  }catch(e){
    const msg = {cancelled:"Stopped.", not_granted:"Smart import needs your OK to use Claude. You can still add items by hand.", rate_limited:"Too many requests right now. Wait a minute and try again.", invalid_json:"Claude's answer couldn't be read. Press Read it to try again.", prompt_too_large:"That's too much text at once. Paste one section at a time.", image_rejected:"One of the images couldn't be read. Try a different photo (JPG or PNG).", refused:"Claude couldn't work with that material. Try different text."}[e&&e.code] || "Something went wrong reading that. Try again.";
    state.impStatusMsg=msg;
    if(e && (e.code==="not_granted"||e.code==="sampling_disabled")) state.sample=null;
    state.impBusy=false; render(); $("#impStatus") && ($("#impStatus").textContent=msg); return;
  }
  state.impBusy=false; render();
}

// ---------- ask claude ----------
let askCtl=null;
async function runAsk(q){
  if(!q || !state.sample) return;
  const out=$("#askOut"); state.askBusy=true; state.askHasAnswer=true;
  out.innerHTML=`<span class="status"><span class="spin"></span>Thinking…</span>`;
  askCtl?.abort(); askCtl=new AbortController();
  const t=iso(today()); const lo=iso(addDays(today(),-7)), hi=iso(addDays(today(),75));
  const ctx = allItems().filter(i=>i.cat==="return"||i.cat==="paper"||i.cat==="task"? !isDone(i) : (i.date>=lo && i.date<=hi) || (i.endDate&&i.endDate>=t)).sort(sortByDate).slice(0,250)
    .map(i=>({section:CATS[i.cat]?.label, title:i.title, date:i.date, endDate:i.endDate||undefined, start:i.start||undefined, end:i.end||undefined, where:i.location||undefined, who:i.person||undefined, slot:i.slot||undefined,
      bring:(i.bring||[]).filter(b=>!b.done).map(b=>b.t), store:i.store||undefined, returnBy:i.returnBy||undefined, status:i.status||undefined, amount:i.amount||undefined, payMethod:i.method||undefined, payTo:i.payTo||undefined, repeats:i.repeat||undefined, notes:i.notes||undefined}));
  const prompt = `You help a busy parent stay organized. Today is ${today().toDateString()}. Here is their docket as JSON:\n${JSON.stringify(ctx)}\n\nQuestion: ${q}\n\nAnswer in plain text (no markdown symbols like ** or #). Be brief and practical: short lines, dates written like "Thu Dec 3". Use only the docket above; if something isn't there, say so.`;
  try{
    await state.sample(prompt,{signal:askCtl.signal, cache:false, onText:({text})=>{ const o=$("#askOut"); if(o) o.textContent=text; }});
  }catch(e){
    const o=$("#askOut"); if(!o) return;
    if(e.code==="cancelled") return;
    o.textContent = e.text || ({not_granted:"Asking Claude needs your OK.", rate_limited:"Too many requests right now. Try again in a minute."}[e.code] || "Couldn't get an answer. Try again.");
    if(e.code==="not_granted"||e.code==="sampling_disabled"){ state.sample=null; }
  } finally { state.askBusy=false; }
}

// ---------- events ----------
document.addEventListener("click", e=>{
  if(e.target.closest(".tick, a[href^='http'], a[href^='/_blob/'], label.photo-btn") || e.target.closest("dialog")) return;
  const el=e.target.closest("[data-pay],[data-done],[data-filter],[data-draftret],[data-startret],[data-photo],[data-show],[data-newcard],[data-person],[data-kind],[data-go],[data-new],[data-paid],[data-method],[data-weekday],[data-id],[data-store],[data-cal],[data-day],[data-advance],[data-act],[data-ask],[data-rmimg],#btnRead,#btnStop");
  if(!el) return;
  if(el.dataset.pay){ const it=state.items.get(el.dataset.pay); if(it) openPay(it); return; }
  if(el.dataset.done){ const it=state.items.get(el.dataset.done); if(it){ const nx=completeItem(it,{status:"Done"}); toast(nx?`Done. Next one due ${fmtDate(nx.date,{month:"short",day:"numeric"})}`:"Marked done"); } return; }
  if(el.dataset.filter){ state[el.dataset.filter]=el.dataset.val; render(); return; }
  if(el.dataset.draftret){ el.disabled=true; draftReturn(el.dataset.draftret); return; }
  if(el.dataset.startret!==undefined){ startReturn(+el.dataset.startret); return; }
  if(el.dataset.photo){ e.stopPropagation(); openPhoto(el.dataset.photo); return; }
  if(el.dataset.show){ const c=state.items.get(el.dataset.show); if(c) showCard(c); return; }
  if(el.hasAttribute("data-newcard")){ openCardEditor({}); return; }
  if(el.dataset.person){ state.personFilter=el.dataset.person; render(); return; }
  if(el.dataset.kind){ state.kindFilter=el.dataset.kind; render(); return; }
  if(el.dataset.paid){ e.stopPropagation(); const it=state.items.get(el.dataset.paid); if(it){ const nx=completeItem(it,{status:"Paid", paidOn:iso(today())}); toast(nx?`Paid. Next one due ${fmtDate(nx.date,{month:"short",day:"numeric"})}`:"Marked paid"); } return; }
  if(el.dataset.method){ state.methodFilter=el.dataset.method; render(); return; }
  if(el.dataset.weekday){ const d=parseD(el.dataset.weekday); state.calMonth=new Date(d.getFullYear(),d.getMonth(),1); state.q=""; go("calendar"); return; }
  if(el.dataset.advance){ e.stopPropagation(); const it=state.items.get(el.dataset.advance); if(it){ const i=RET_STEPS.indexOf(it.status||"To return"); saveItem({...it,status:RET_STEPS[Math.min(i+1,3)]}); toast("Marked "+RET_STEPS[Math.min(i+1,3)].toLowerCase()); } return; }
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.new){ openEditor({cat:el.dataset.new, date: el.dataset.new==="return"?iso(today()):"" , returnBy: el.dataset.new==="return"?iso(addDays(today(),30)):"", store: el.dataset.new==="return"?(state.storeFilter!=="All"&&STORES[state.storeFilter]?state.storeFilter:"Amazon"):undefined}); return; }
  if(el.dataset.id && !el.dataset.advance){ e.stopPropagation(); const it=state.items.get(el.dataset.id); if(it) openEditor(it); return; }
  if(el.dataset.store){ state.storeFilter=el.dataset.store; render(); return; }
  if(el.dataset.cal!==undefined){ const n=+el.dataset.cal; if(n===0){ const d=today(); state.calMonth=new Date(d.getFullYear(),d.getMonth(),1); } else { const m=state.calMonth; state.calMonth=new Date(m.getFullYear(), m.getMonth()+n, 1); } render(); return; }
  if(el.dataset.day){ openEditor({cat:"event", date:el.dataset.day}); return; }
  if(el.dataset.ask){ const q=$("#askQ"); if(q) q.value=el.dataset.ask; runAsk(el.dataset.ask); return; }
  if(el.dataset.rmimg){ const i=+el.dataset.rmimg; URL.revokeObjectURL(state.images[i].url); state.images.splice(i,1); render(); return; }
  if(el.id==="btnRead"){ runImport(); return; }
  if(el.id==="btnStop"){ impCtl?.abort(); return; }
  const a=el.dataset.act;
  if(a==="clear-q"){ state.q=""; $("#q").value=""; render(); }
  if(a==="clear-examples"){ const ex=allItems().filter(i=>i.example); ex.forEach(i=>removeItem(i.id)); toast(`Cleared ${ex.length} examples`); }
  if(a==="prev-clear"){ state.preview=[]; render(); }
  if(a==="prev-save"){ savePreview(); }
  if(a==="check-mail"){ checkEmail(); }
  if(a==="tidy"){ tidyUp(); }
  if(a==="tidy-undo"){ undoTidy(); }
  if(a==="note-x"){ state.sortNote=""; state.lastTidy=null; render(); }
  if(a==="ics-all"){ const t=iso(today()), hi=iso(addDays(today(),14)); exportICS(allItems().filter(i=>i.cat!=="return"&&i.date&&i.date>=t&&i.date<=hi), "next-two-weeks.ics"); }
  if(a==="ics-cat"){ const t=iso(today()); exportICS(allItems().filter(i=>i.cat===el.dataset.cat && i.date && (i.endDate||i.date)>=t), slug(CATS[el.dataset.cat].label)+".ics"); }
});
async function savePreview(){
  const list=state.preview.filter(p=>p._on).map(p=>{ const {_on,...rest}=p; rest.createdAt=new Date().toISOString(); return rest; });
  if(!list.length || state.saving) return;
  state.saving=true;
  // Keep the original sheet or flyer with every item it produced.
  if(state.images.length && state.assets && state.previewFrom!=="email"){
    toast("Saving the original photo…");
    const ids=await uploadPhotos(state.images.map(f=>f.file));
    if(ids.length) list.forEach(it=>{ it.photos=[...photoIds(it), ...ids]; });
    state.images.forEach(f=>URL.revokeObjectURL(f.url)); state.images=[];
  }
  saveMany(list); state.preview=[]; state.previewFrom=""; state.saving=false;
  const counts={}; list.forEach(i=>{ const l=CATS[i.cat]?.label||"Other"; counts[l]=(counts[l]||0)+1; });
  state.sortNote=`Added ${list.length} item${list.length===1?"":"s"}: ` + Object.entries(counts).map(([l,n])=>`${n} to ${l}`).join(", ") + ".";
  toast(state.sortNote); go("today");
}
// Tidy up: Claude checks every open item and moves anything that's in the wrong section.
async function tidyUp(){
  if(!state.sample || state.tidyBusy) return;
  const open=allItems().filter(i=>CATS[i.cat] && !isDone(i));
  if(!open.length){ toast("Nothing to tidy."); return; }
  state.tidyBusy=true; render();
  try{
    const arr=await state.sample.json(`You are tidying a family organizer. Sections: "school" (school calendar dates), "event" (things you attend: PTA, parties, camp sessions, games), "return" (store returns), "pay" (money owed), "paper" (forms, registrations, permission slips, documents to fill out or sign), "appt" (doctor, dentist and similar visits), "task" (other to-dos).
${SORT_RULES}
Here are the items with their current section. Reply with only a JSON array of the items that are in the WRONG section: [{"id": "...", "cat": "correct section"}]. Reply [] if everything is in the right place. Do not move an item just because it is related to another one.

ITEMS:
${JSON.stringify(open.slice(0,300).map(i=>({id:i.id, cat:i.cat, title:i.title, notes:(i.notes||"").slice(0,160), amount:i.amount||undefined, bring:(i.bring||[]).map(b=>b.t).slice(0,4)})))}`, {modelTier:"default", cache:false});
    const moves=(Array.isArray(arr)?arr:[]).filter(m=>m&&state.items.has(m.id)&&CATS[m.cat]&&state.items.get(m.id).cat!==m.cat);
    if(!moves.length){ state.sortNote="Everything is already in the right section."; return; }
    state.lastTidy=moves.map(m=>({id:m.id, cat:state.items.get(m.id).cat, status:state.items.get(m.id).status}));
    const updated=moves.map(m=>{ const it={...state.items.get(m.id), cat:m.cat};
      if(m.cat==="pay") it.status=it.status==="Paid"?"Paid":"Unpaid"; else if(m.cat==="paper"||m.cat==="task") it.status=it.status==="Done"?"Done":"To do"; else if(m.cat==="return") it.status=it.status||"To return"; else delete it.status;
      return it; });
    saveMany(updated);
    state.sortNote=`Moved ${moves.length} item${moves.length===1?"":"s"}: ` + updated.map(u=>`"${u.title}" to ${CATS[u.cat].label}`).join(", ") + ".";
  }catch(e){ state.sortNote = e&&e.code==="not_granted" ? "Allow Claude to use this page to tidy up." : "Couldn't tidy up just now. Try again."; }
  finally{ state.tidyBusy=false; render(); }
}
function undoTidy(){
  const back=(state.lastTidy||[]).map(b=>{ const it=state.items.get(b.id); if(!it) return null; const x={...it, cat:b.cat}; if(b.status) x.status=b.status; else delete x.status; return x; }).filter(Boolean);
  if(back.length) saveMany(back);
  state.lastTidy=null; state.sortNote="Moved them back."; render();
}
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.matches?.(".row,.card")){ e.target.click(); }
  if(e.key==="/" && !e.target.matches("input,textarea,select") && !$("#dlg").open){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape" && document.activeElement===$("#q")){ $("#q").value=""; state.q=""; render(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.addphoto && t.files && t.files.length){
    const id=t.dataset.addphoto; toast("Saving photo…");
    uploadPhotos([...t.files]).then(ids=>{ const it=state.items.get(id); if(it && ids.length){ saveItem({...it, photos:[...photoIds(it), ...ids]}); toast("Photo added"); } });
    return;
  }
  if(t.dataset.tick){ const it=state.items.get(t.dataset.tick); if(it){ const bring=(it.bring||[]).map(b=>({...b})); const b=bring[+t.dataset.ti]; if(b){ b.done=t.checked; saveItem({...it,bring}); } } return; }
  if(t.dataset.pon!==undefined){ state.preview[+t.dataset.pon]._on=t.checked; render(); }
  if(t.dataset.pcat!==undefined){ const p=state.preview[+t.dataset.pcat]; p.cat=t.value; if(t.value==="return"){ p.status="To return"; p.store=p.store||"Amazon"; } else if(t.value==="paper"||t.value==="task") p.status="To do"; }
  if(t.id==="impImg"){ addImages([...t.files]); }
  if(t.id==="impHint") state.impHint=t.value;
});
document.addEventListener("submit", e=>{
  if(e.target.id==="askForm"){ e.preventDefault(); runAsk($("#askQ").value.trim()); }
  if(e.target.id==="orderForm"){ e.preventDefault(); findOrder($("#orderQ").value.trim()); }
  if(e.target.id==="msForm"){ e.preventDefault(); searchMailFor(e.target.dataset.cat, $("#msQ").value.trim(), $("#msRange").value); }
});
let qT; $("#q").addEventListener("input", e=>{ clearTimeout(qT); qT=setTimeout(()=>{ state.q=e.target.value.trim(); render(); },120); });
function addImages(files){
  const ok=files.filter(f=>/^image\/(jpeg|png|webp|gif)$/.test(f.type)).slice(0, Math.max(0,(state.imgMax||5)-state.images.length));
  ok.forEach(f=>state.images.push({file:f,url:URL.createObjectURL(f)}));
  if(files.length && !ok.length) toast("Use JPG, PNG, WebP or GIF images.");
  render();
}
document.addEventListener("dragover", e=>{ const d=e.target.closest?.("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e=>{ const d=e.target.closest?.("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop", e=>{ const d=e.target.closest?.("#drop"); if(!d) return; e.preventDefault(); d.classList.remove("over");
  const files=[...(e.dataTransfer?.files||[])]; if(files.length && state.imgOK) addImages(files);
  else { const txt=e.dataTransfer?.getData("text"); if(txt){ $("#impText").value=txt; } } });

$("#tabAdd").onclick=()=>{ document.body.classList.remove("menu-open"); openQuickAdd(); };
$("#tabMore").onclick=()=>{ document.body.classList.toggle("menu-open"); renderNav(); };
$("#nav").addEventListener("click", e=>{ if(e.target.closest("a")) document.body.classList.remove("menu-open"); });
document.querySelectorAll("#tabbar a").forEach(a=>a.addEventListener("click", ()=>document.body.classList.remove("menu-open")));
$("#btnShare").onclick=()=>openShare();
// Tapping the name goes home and refreshes: clears search and filters, redraws with the latest saved items.
$("#brandHome").onclick=e=>{ e.preventDefault();
  state.q=""; $("#q").value=""; state.personFilter="All"; state.kindFilter="all"; state.storeFilter="All"; state.methodFilter="All"; state.calMonth=null;
  if(state.mode==="local"){ state.items=new Map(); loadLocal(); }
  go("today"); toast("Refreshed"); };
$("#btnImport").onclick=()=>go("import");

// sample image support
(async()=>{ try{ const s = window.claude && await window.claude.use("sample"); if(s){ const lim=await s.limits().catch(()=>null); if(lim?.images){ state.imgOK=true; state.imgMax=lim.images.maxCount; render(); } } }catch(e){} })();

route();
initData();
})();
